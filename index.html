<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GreenFit | Dashboard</title>
    <style>
        body { font-family: sans-serif; background-color: #f0fdf4; color: #166534; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { color: #15803d; font-size: 3rem; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #bbf7d0; border-radius: 5px; }
        button { background: #22c55e; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GreenFit</h1>
        <p>Log your activity to the secure database.</p>
        <hr>
        <form id="workoutForm">
            <input type="text" id="userName" placeholder="Your Name" required>
            <input type="text" id="activity" placeholder="Activity (e.g., Cycling, Running)" required>
            <input type="number" id="duration" placeholder="Duration (minutes)" required>
            <button type="submit">Update Database</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('userName').value,
                activity: document.getElementById('activity').value,
                duration: document.getElementById('duration').value
            };

            const response = await fetch('/update-db', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('status').innerText = "✅ Successfully updated MongoDB!";
                document.getElementById('workoutForm').reset();
            }
        });
    </script>
</body>
</html>
